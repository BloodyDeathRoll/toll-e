services:
  db:
    image: postgres:17-alpine
    container_name: arnak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arnak
      POSTGRES_PASSWORD: arnak
      POSTGRES_DB: arnak
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - arnak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arnak -d arnak']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arnak-pgdata:
