name: Claude Code Review

# Automatic review of every PR push via the code-review plugin (same as wtw).
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret and the Claude GitHub App.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # claude-code-action refuses bot-initiated runs ("Workflow initiated by
    # non-human actor") and Dependabot runs can't see the OAuth secret anyway,
    # so every Dependabot PR showed a red check. Skip bots; `@claude review` on
    # a Dependabot PR still works because that comes from a human comment.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # persist-credentials stays ON here: claude-code-action fetches the PR
          # branch with checkout's token before it sets up its own App auth —
          # with it off, `git fetch origin <branch>` fails (run 34259956274).
          persist-credentials: true
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1 (v1)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
