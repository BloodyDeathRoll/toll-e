name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: both jobs only read the repo.
# upload-artifact needs no write scope. Actions are pinned to commit SHAs
# (tag comments are for humans; Dependabot updates both).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toll-e
          POSTGRES_PASSWORD: toll-e
          POSTGRES_DB: toll-e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toll-e -d toll-e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://toll-e:toll-e@127.0.0.1:5432/toll-e
      BETTER_AUTH_SECRET: ci-only-smoke-secret
      BETTER_AUTH_URL: http://localhost:3000
      # Lets the smoke suite sign in without real Google OAuth. Never set on
      # Vercel, and lib/auth.ts additionally refuses it when VERCEL_ENV=production.
      E2E_TEST_AUTH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      # Playwright drives the runner's preinstalled Chrome (channel: 'chrome');
      # the config starts `pnpm start` itself.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
